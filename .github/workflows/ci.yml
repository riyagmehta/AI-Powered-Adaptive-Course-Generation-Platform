name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: course_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d course_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/course_platform
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-throwaway-secret-not-used-anywhere-real
      # Never actually called for real: every test that touches the OpenAI
      # client goes through the fake_openai fixture. No Pinecone credentials
      # here at all — tests requiring a live Pinecone index are marked
      # `live` and excluded below; run them locally instead (see README).
      OPENAI_API_KEY: sk-ci-placeholder-never-called-for-real
      PINECONE_API_KEY: ""
      PINECONE_INDEX_NAME: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests (excluding tests that need a live Pinecone index)
        run: pytest -x -m "not live"

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build
