[pytest]
asyncio_mode = auto
pythonpath = .
asyncio_default_fixture_loop_scope = session
markers =
    live: requires a real, reachable Pinecone index (and would need real OpenAI
        credentials for anything not covered by the fake_openai fixture) — needs
        real credentials, so CI runs everything except these (`pytest -m "not live"`).
        Run locally with `pytest -m live`.
