# Render Blueprint — deploys the API (with the ARQ worker running in-process
# inside it, see below), Postgres, and Redis together. Sync this repo as a
# Blueprint from the Render dashboard (New + Blueprint), or run
# `render blueprint launch` with the CLI. Everything here targets Render's
# free tier: free web services spin down after 15 minutes of inactivity, so
# the first request afterward takes 30-60s to wake back up; free Postgres
# expires 30 days after creation (14-day grace period after that); free Key
# Value (Redis) is capped at 25MB and its data does not survive a restart.
# See backend/app/services/job_queue.py for how job state is recovered when
# the worker restarts.
#
# There is no separate worker service here on purpose: Render's free tier
# only offers Free instances for web services, Postgres, and Key Value —
# background workers require a paid plan. RUN_WORKER_IN_PROCESS=true below
# makes the API service's FastAPI lifespan (backend/app/main.py) start the
# ARQ worker as a background task in the same process instead, so job
# processing doesn't depend on a service type this tier can't run. Local
# docker-compose is unaffected — it doesn't set this var, so it keeps
# running the worker as its own container (RUN_WORKER_IN_PROCESS defaults to
# false in backend/app/config.py).

databases:
  - name: course-platform-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - name: course-platform-redis
    type: keyvalue
    plan: free
    region: oregon
    # No external client ever needs to reach this directly — only the API
    # service in this same project, which connects over Render's internal
    # network regardless of this list. Empty blocks public access.
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - name: course-platform-api
    type: web
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: course-platform-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: course-platform-redis
          type: keyvalue
          property: connectionString
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      # Free web services get 512MB RAM / 0.1 CPU. WEB_CONCURRENCY must stay
      # at 1 here for that memory reason (see backend/Dockerfile) — and,
      # since it controls how many separate uvicorn processes run, also
      # because each one now starts its own in-process ARQ worker: more than
      # one would mean multiple workers competing for the same jobs while
      # multiplying memory use, not just extra HTTP capacity.
      - key: WEB_CONCURRENCY
        value: "1"
      # generateValue means Render creates this once, at first sync, and
      # reuses it on every redeploy — there's only one service reading it
      # now that the worker runs in-process, so there's no second copy to
      # drift out of sync with it.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      # Set after the Vercel deploy exists (see README "Production
      # deployment"); a placeholder here would just mean CORS rejects the
      # frontend until it's filled in.
      - key: CORS_ORIGINS
        sync: false
